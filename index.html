function pushUndoFolders(){ ORG.undo.push({type:'folders',agent:ORG.agent,before:[...((World.folders||{})[ORG.agent]||[])]}); }
async function applyPatches(list,label,foldersBefore){
  const A=ORG.agent, files=orgFiles(A), rec={type:'patch',agent:A,label,items:[],folders:foldersBefore||[...((World.folders||{})[A]||[])]};
  let n=0;
  for(const {id,patch} of list){ const x=files.find(f=>f.id===id); if(!x||!canEdit(x)) continue; const before={}; Object.keys(patch).forEach(k=>before[k]=x[k]===undefined?(k==='trash'?false:''):x[k]);
    try{ await Vault.update(A,id,patch); rec.items.push({id,before}); n++; }catch(e){ toast('Gagal: '+(e.message||e)); } }
  if(n){ ORG.undo.push(rec); ORG.undo=ORG.undo.slice(-20); toast(`✓ ${n} file · ${label} — bisa diurungkan ↩️`); if(!stats().org) bump('org'); }
  return n;
}
async function moveSel(to){ const fb=[...((World.folders||{})[ORG.agent]||[])]; const n=await applyPatches([...ORG.sel].map(id=>({id,patch:{folder:to}})),'dipindah ke '+(to||'Server'),fb); if(to){ const f=(World.folders||{})[ORG.agent]||[]; if(!f.includes(to)) setFolders(ORG.agent,[...f,to]); } ORG.sel.clear(); renderOrg(); return n; }
async function renameFolder(from,to){
  const A=ORG.agent; if(!to||to===from) return renderOrg(); if(orgFolders(A).includes(to)) return toast('Nama folder itu sudah dipakai');
  const list=orgFiles(A).filter(x=>x.folder===from||String(x.folder||'').startsWith(from+'/')).map(x=>({id:x.id,patch:{folder:to+String(x.folder).slice(from.length)}}));
  pushUndoFolders(); setFolders(A,((World.folders||{})[A]||[]).map(p=>p===from||p.startsWith(from+'/')?to+p.slice(from.length):p));
  if(list.length) await applyPatches(list,'folder diganti nama'); else toast('Folder diganti nama ✓');
  renderOrg();
}
async function dissolveFolder(p){
  const A=ORG.agent, up=parentOf(p);
  const list=orgFiles(A).filter(x=>x.folder===p||String(x.folder||'').startsWith(p+'/')).map(x=>({id:x.id,patch:{folder:up+(up&&x.folder!==p?'/':'')+String(x.folder).slice(p.length+1)}}));
  pushUndoFolders(); setFolders(A,((World.folders||{})[A]||[]).filter(q=>q!==p&&!q.startsWith(p+'/')));
  if(list.length) await applyPatches(list.map(l=>({...l,patch:{folder:normPath(l.patch.folder)}})),'folder dibubarkan (isi naik satu tingkat)'); else toast('Folder dihapus ✓');
  renderOrg();
}
async function orgUndo(){
  const r=ORG.undo.pop(); if(!r) return;
  if(r.type==='folders'){ World.folders={...(World.folders||{}),[r.agent]:r.before}; WorldStore.saveSoon(); toast('↩️ Diurungkan'); return renderOrg(); }
  for(const it of r.items){ try{ await Vault.update(r.agent,it.id,it.before); }catch(e){} }
  World.folders={...(World.folders||{}),[r.agent]:r.folders}; WorldStore.saveSoon();
  toast(`↩️ Diurungkan: ${r.label}`); renderOrg();
}

  if(o==='trash'){ ORG.view='trash'; return renderOrg(); }
  if(o==='auto'){ const L=orgFiles(A).filter(x=>!x.trash&&!x.folder&&canEdit(x)).map(x=>({id:x.id,from:'',to:typeFolder(x),name:x.name}));
    ORG.plan={title:'🧹 Rapikan otomatis per jenis',why:'File di luar folder dikelompokkan: Dokumen, Gambar, Data, Presentasi, Kode, dan Hasil Kerja per bulan.',moves:L}; return renderOrg(); }

async function orgExport(toDisk){
  const A=ORG.agent, a=ALL_AGENTS[A], list=orgFiles(A).filter(x=>!x.trash);
  if(!list.length) return toast('Server ini masih kosong');
  const safe=s=>String(s).replace(/[\\/:*?"<>|]+/g,'-').slice(0,80);
  const fname=x=>safe(x.kind==='hasil'&&!/\.\w+$/.test(x.name)?x.name+'.md':x.name);
  if(toDisk){
    if(!('showDirectoryPicker' in window)){ toast('Browser ini belum mendukung simpan ke folder — memakai ZIP'); return orgExport(false); }
    let dir; try{ dir=await window.showDirectoryPicker({mode:'readwrite'}); }catch(e){ if(e&&e.name==='AbortError') return; toast(inClaudeAI()?'Di claude.ai akses folder dibatasi — memakai ZIP. Buka lewat Live Server untuk simpan langsung ke folder.':'Folder tidak bisa dibuka — memakai ZIP'); return orgExport(false); }
    toast('📂 Menulis ke folder…'); let n=0;
    try{ const root=await dir.getDirectoryHandle(safe('Server '+a.name),{create:true});
      for(const x of list){ let d=root; for(const part of normPath(x.folder).split('/').filter(Boolean)) d=await d.getDirectoryHandle(part,{create:true});
        const c=await Vault.content(A,x.id); const fh=await d.getFileHandle(fname(x),{create:true}); const w=await fh.createWritable(); await w.write(c.dataUrl?dataUrlToBlob(c.dataUrl):(c.text||'')); await w.close(); n++; }
      toast(`✅ ${n} file tersusun disimpan ke folder "Server ${a.name}" di laptopmu`);
    }catch(e){ toast('Gagal menulis: '+(e.message||e)); }
    return;
  }
  try{ toast('Menyiapkan ZIP…'); await loadLib('jszip'); const zip=new JSZip();
    for(const x of list){ const c=await Vault.content(A,x.id); const p=(normPath(x.folder)?normPath(x.folder)+'/':'')+fname(x); zip.file(p,c.dataUrl?dataUrlToBlob(c.dataUrl):(c.text||'')); }
    orgFolders(A).forEach(p=>zip.folder(p));
    const dl=await getDownloads(); if(!dl) return toast('Unduhan tidak tersedia di tampilan ini.');
    await dl.save({filename:`server-${baseName(a.name,'asisten')}.zip`,data:await zip.generateAsync({type:'blob'})}); toast('ZIP tersusun siap ✓');
  }catch(e){ if(!(e&&e.code==='declined')) toast('Gagal: '+(e.message||e)); }
}

/* =====================================================================
   MARKDOWN MINI (aman: semua teks di-escape dulu)
   ===================================================================== */
function md(src){
  const blocks=[]; let s=String(src||'');
  s=s.replace(/```([\w-]*)\n?([\s\S]*?)(```|$)/g,(m,lang,code,end)=>{
    let lg=(lang||'').toLowerCase(); if((lg===''||lg==='xml')&&/^\s*<svg[\s>]/i.test(code)) lg='svg';
    const rb=richBlock(lg,code,end==='```');
    blocks.push(rb||`<pre><code>${esc(code.replace(/\n$/,''))}</code></pre>`); return `\u0000${blocks.length-1}\u0000`; });
  const inline=t=>esc(t).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<i>$2</i>')
     .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  const lines=s.split('\n'); let out='', list=null, para=[];
  const flushP=()=>{ if(para.length){ out+=`<p>${para.map(inline).join('<br>')}</p>`; para=[]; } };
  const flushL=()=>{ if(list){ out+=`<${list.t}>${list.items.map(i=>`<li>${inline(i)}</li>`).join('')}</${list.t}>`; list=null; } };
  for(let i=0;i<lines.length;i++){
    const l=lines[i]; let m;
    if(/^\u0000\d+\u0000$/.test(l.trim())){ flushP(); flushL(); out+=blocks[+l.trim().slice(1,-1)]; continue; }
    if(m=l.match(/^(#{1,4})\s+(.*)/)){ flushP(); flushL(); const n=Math.min(3,m[1].length); out+=`<h${n}>${inline(m[2])}</h${n}>`; continue; }
    if(/^\s*\|.*\|\s*$/.test(l) && i+1<lines.length && /^\s*\|?\s*:?-{2,}/.test(lines[i+1])){
      flushP(); flushL(); const row=r=>r.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
      const head=row(l); i++; let body=''; while(i+1<lines.length && /^\s*\|.*\|\s*$/.test(lines[i+1])){ i++; body+=`<tr>${row(lines[i]).map(c=>`<td>${inline(c)}</td>`).join('')}</tr>`; }
      out+=`<table><thead><tr>${head.map(c=>`<th>${inline(c)}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table>`; continue; }
    if(m=l.match(/^\s*[-*•]\s+(.*)/)){ flushP(); if(!list||list.t!=='ul'){ flushL(); list={t:'ul',items:[]}; } list.items.push(m[1]); continue; }
    if(m=l.match(/^\s*\d+[.)]\s+(.*)/)){ flushP(); if(!list||list.t!=='ol'){ flushL(); list={t:'ol',items:[]}; } list.items.push(m[1]); continue; }
    if(m=l.match(/^>\s?(.*)/)){ flushP(); flushL(); out+=`<blockquote>${inline(m[1])}</blockquote>`; continue; }
    if(/^\s*(---|\*\*\*)\s*$/.test(l)){ flushP(); flushL(); out+='<hr>'; continue; }
    if(!l.trim()){ flushP(); flushL(); continue; }
    flushL(); para.push(l);
  }
  flushP(); flushL();
  return refButtons(out.replace(/\u0000(\d+)\u0000/g,(m,n)=>blocks[+n]));
}
